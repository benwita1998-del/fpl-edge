<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>FPL Edge</title>

<style>
:root{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1020;
  color:#f4f6fb
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#f4f6fb
}

.wrap{
  max-width:1250px;
  margin:auto;
  padding:18px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap
}

.logo{
  font-size:25px;
  font-weight:900
}

.muted{
  color:#9da7bc
}

.btn{
  border:1px solid #303a52;
  background:#151d31;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer
}

.btn.active{
  background:#fff;
  color:#101522
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:18px 0
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.card{
  background:#121a2b;
  border:1px solid #27324a;
  border-radius:14px;
  padding:15px
}

.wide{
  grid-column:1/-1
}

.label{
  font-size:12px;
  color:#8e9ab2;
  text-transform:uppercase;
  letter-spacing:.08em
}

.big{
  font-size:24px;
  font-weight:800;
  margin-top:5px
}

.scroll{
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  text-align:left;
  padding:9px;
  border-bottom:1px solid #27324a;
  white-space:nowrap;
  font-size:13px
}

.pill{
  padding:3px 7px;
  border-radius:999px;
  background:#24304a;
  display:inline-block;
  margin:2px
}

.good{
  color:#7ee2a8
}

.bad{
  color:#ff8d9d
}

.warn{
  color:#ffd36e
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #27324a
}

.footer{
  margin:20px 0;
  color:#75809a;
  font-size:12px
}

.error{
  border:1px solid #7d3340;
  background:#29151b;
  color:#ffd7dd
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .wrap{
    padding:12px
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr
  }

  .big{
    font-size:20px
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div>
      <div class="logo">⚽ FPL Edge</div>
      <div class="muted" id="sub">
        Loading your team…
      </div>
    </div>

    <button class="btn" onclick="loadAll()">
      Refresh live data
    </button>

  </div>


  <div class="tabs">

    <button class="btn active" data-tab="home">
      Dashboard
    </button>

    <button class="btn" data-tab="fixtures">
      Fixtures
    </button>

    <button class="btn" data-tab="prices">
      Prices
    </button>

    <button class="btn" data-tab="history">
      History
    </button>

    <button class="btn" data-tab="chips">
      Chips
    </button>

  </div>


  <div id="app"></div>


  <div class="footer">
    FPL Edge uses official FPL public data.
    Recommendations are model projections, not guaranteed points.
  </div>

</div>


<script>

/* =====================================================
   FPL EDGE
   ===================================================== */

const CACHE_URL =
  'https://raw.githubusercontent.com/benwita1998-del/fpl--edge/refs/heads/fpl-cache/data/live.json';


let D = null;


const $ = selector =>
  document.querySelector(selector);


const money = value =>
  `£${(Number(value || 0) / 10).toFixed(1)}m`;


const esc = value =>
  String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');


/* =====================================================
   ARRAY SAFETY
   ===================================================== */

function asArray(value){

  if(Array.isArray(value)){
    return value;
  }

  if(value && Array.isArray(value.picks)){
    return value.picks;
  }

  if(value && Array.isArray(value.current)){
    return value.current;
  }

  if(value && Array.isArray(value.results)){
    return value.results;
  }

  return [];

}


/* =====================================================
   NORMALISE FPL DATA
   ===================================================== */

function normalise(j){

  const b =
    j.bootstrap ||
    {};


  const entry =
    j.entry ||
    {};


  /*
   PICKS CAN BE:

   j.picks = [...]
   
   OR

   j.picks = {
      picks: [...]
   }
  */

  let picks = [];

  if(Array.isArray(j.picks)){
    picks = j.picks;
  }
  else if(
    j.picks &&
    Array.isArray(j.picks.picks)
  ){
    picks = j.picks.picks;
  }


  /*
   HISTORY CAN BE:

   [...]
   
   OR

   {
      current: [...]
   }
  */

  let history = [];

  if(Array.isArray(j.history)){
    history = j.history;
  }
  else if(
    j.history &&
    Array.isArray(j.history.current)
  ){
    history = j.history.current;
  }


  /*
   TRANSFERS
  */

  let transfers = [];

  if(Array.isArray(j.transfers)){
    transfers = j.transfers;
  }
  else if(
    j.transfers &&
    Array.isArray(j.transfers.results)
  ){
    transfers = j.transfers.results;
  }


  /*
   FIXTURES
  */

  const fixtures =
    Array.isArray(j.fixtures)
      ? j.fixtures
      : Array.isArray(b.fixtures)
        ? b.fixtures
        : [];


  /*
   TEAMS
  */

  const teams = {};

  (Array.isArray(b.teams) ? b.teams : [])
    .forEach(team => {
      teams[team.id] = team;
    });


  /*
   PLAYERS
  */

  const players = {};

  (Array.isArray(b.elements) ? b.elements : [])
    .forEach(player => {
      players[player.id] = player;
    });


  /*
   EVENTS / GAMEWEEK
  */

  const events =
    Array.isArray(b.events)
      ? b.events
      : [];


  let gw =
    j.gameweek ||
    entry.current_event ||
    events.find(e => e.is_current)?.id ||
    events.find(e => e.is_next)?.id ||
    1;


  /*
   FIXTURE LOOKUP
  */

  const fixtureFor = (
    teamId,
    number = 5
  ) => {

    if(!teamId){
      return [];
    }


    const upcoming =
      fixtures

        .filter(f => {

          const correctTeam =
            f.team_h === teamId ||
            f.team_a === teamId;

          const future =
            Number(f.event) >= Number(gw);

          return correctTeam && future;

        })

        .sort(
          (a,b) =>
            Number(a.event) -
            Number(b.event)
        )

        .slice(
          0,
          number
        );


    return upcoming.map(f => {

      const home =
        f.team_h === teamId;


      const opponent =
        teams[
          home
            ? f.team_a
            : f.team_h
        ];


      return {

        home,

        opponent:
          opponent?.short_name ||
          opponent?.name ||
          '?',

        fdr:
          home
            ? f.team_h_difficulty
            : f.team_a_difficulty,

        event:
          f.event

      };

    });

  };


  /*
   CURRENT SQUAD
  */

  const squad =
    picks.map(x => {

      const p =
        players[x.element] ||
        {};


      let position =
        'FWD';


      if(x.position === 1){
        position = 'GK';
      }
      else if(x.position <= 5){
        position = 'DEF';
      }
      else if(x.position <= 8){
        position = 'MID';
      }


      return {

        pick:x,

        player:p,

        position,

        next5:
          fixtureFor(
            p.team,
            5
          )

      };

    });


  /*
   ALL PLAYERS
  */

  const allPlayers =
    Object.values(players)
      .map(p => {

        return {

          id:p.id,

          name:
            p.web_name,

          team_short:
            teams[p.team]?.short_name ||
            '?',

          price:
            p.now_cost ||
            0,

          total_points:
            p.total_points ||
            0,

          form:
            p.form ||
            '0',

          status:
            p.status ||
            '?',

          news:
            p.news ||
            '',

          next5:
            fixtureFor(
              p.team,
              5
            ),

          price_change:
            Number(
              p.cost_change_event ||
              0
            ) / 10

        };

      });


  /*
   CHIP INFORMATION

   We will later connect this to
   actual chip history.
  */

  const chips = [

    {
      label:'Wildcard',
      half:1
    },

    {
      label:'Free Hit',
      half:1
    },

    {
      label:'Bench Boost',
      half:1
    },

    {
      label:'Triple Captain',
      half:1
    },

    {
      label:'Wildcard',
      half:2
    },

    {
      label:'Free Hit',
      half:2
    },

    {
      label:'Bench Boost',
      half:2
    },

    {
      label:'Triple Captain',
      half:2
    }

  ];


  /*
   RETURN NORMALISED DATA
  */

  return {

    bootstrap:b,

    entry,

    history,

    transfers,

    picks,

    gw,

    squad,

    allPlayers,

    teams,

    fixtures,

    chips,

    rank:
      entry.summary_overall_rank ||
      0,

    points:
      entry.summary_event_points ||
      0,

    totalPoints:
      entry.summary_overall_points ||
      entry.summary_total_points ||
      0,

    value:
      entry.value ||
      0,

    bank:
      entry.bank ||
      0,

    freeTransfers:
      entry.transfers ||
      1,

    manager:
      [
        entry.player_first_name,
        entry.player_last_name
      ]
      .filter(Boolean)
      .join(' '),

    teamName:
      entry.name ||
      'FPL Team'

  };

}


/* =====================================================
   LOAD LIVE DATA
   ===================================================== */

async function loadAll(){

  $('#sub').textContent =
    'Syncing official FPL data…';


  $('#app').innerHTML = `
    <div class="card">
      <div class="muted">
        Loading live FPL snapshot…
      </div>
    </div>
  `;


  try{

    const response =
      await fetch(
        CACHE_URL +
        '?t=' +
        Date.now(),
        {
          cache:'no-store'
        }
      );


    if(!response.ok){

      throw new Error(
        'FPL cache returned HTTP ' +
        response.status
      );

    }


    const json =
      await response.json();


    D =
      normalise(json);


    $('#sub').textContent =
      `${D.teamName} · GW${D.gw} · ${D.manager}`;


    render('home');

  }

  catch(error){

    console.error(
      'FPL Edge data error:',
      error
    );


    $('#app').innerHTML = `
      <div class="card error">

        <b>
          Unable to load FPL data
        </b>

        <p>
          ${esc(error.message)}
        </p>

        <p class="muted">
          The app is connected directly
          to the GitHub FPL cache.
        </p>

      </div>
    `;


    $('#sub').textContent =
      'FPL data connection failed';

  }

}


/* =====================================================
   FIXTURE DISPLAY
   ===================================================== */

function fixture(f){

  return `
    <span class="pill">
      ${f.home ? 'H' : 'A'}
      ${esc(f.opponent)}
      · FDR ${f.fdr}
    </span>
  `;

}


/* =====================================================
   STATISTICS
   ===================================================== */

function stats(){

  const cards = [

    [
      'Overall rank',
      Number(
        D.rank
      ).toLocaleString()
    ],

    [
      'GW points',
      D.points
    ],

    [
      'Overall points',
      D.totalPoints
    ],

    [
      'Team value',
      money(D.value)
    ],

    [
      'Bank',
      money(D.bank)
    ],

    [
      'Free transfers',
      D.freeTransfers
    ],

    [
      'Squad',
      D.squad.length
    ],

    [
      'Current GW',
      D.gw
    ]

  ];


  return `
    <div class="grid">

      ${
        cards.map(x => `

          <div class="card">

            <div class="label">
              ${x[0]}
            </div>

            <div class="big">
              ${x[1]}
            </div>

          </div>

        `).join('')
      }

    </div>
  `;

}


/* =====================================================
   DASHBOARD
   ===================================================== */

function dashboard(){

  const rows =
    D.squad
      .map(x => {

        const p =
          x.player;


        const status =
          p.status === 'a'

            ? `<span class="good">
                 Available
               </span>`

            : `<span class="warn">
                 ${esc(
                   p.news ||
                   p.status ||
                   'Unknown'
                 )}
               </span>`;


        return `
          <tr>

            <td>

              <b>
                ${esc(
                  p.web_name ||
                  'Unknown'
                )}
              </b>

              <br>

              <span class="muted">
                ${x.position}
              </span>

            </td>


            <td>
              ${esc(
                D.teams[
                  p.team
                ]?.short_name ||
                '?'
              )}
            </td>


            <td>
              ${money(
                p.now_cost
              )}
            </td>


            <td>
              ${p.total_points || 0}
            </td>


            <td>
              ${esc(
                p.form ||
                '0'
              )}
            </td>


            <td>
              ${status}
            </td>


            <td>
              ${
                x.next5
                  .map(fixture)
                  .join(' ')
              }
            </td>

          </tr>
        `;

      })
      .join('');


  const news =
    D.squad

      .filter(x =>
        (
          x.player.status &&
          x.player.status !== 'a'
        )
        ||
        x.player.news
      )

      .map(x => `

        <div class="row">

          <span>
            <b>
              ${esc(
                x.player.web_name
              )}
            </b>
          </span>

          <span class="warn">
            ${esc(
              x.player.news ||
              x.player.status ||
              ''
            )}
          </span>

        </div>

      `)

      .join('');


  return `

    ${stats()}


    <div
      class="card wide"
      style="margin-top:12px"
    >

      <div class="label">
        Current squad
      </div>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>Player</th>
              <th>Club</th>
              <th>Price</th>
              <th>Pts</th>
              <th>Form</th>
              <th>Status</th>
              <th>Next 5</th>

            </tr>

          </thead>


          <tbody>

            ${
              rows ||

              `
                <tr>

                  <td colspan="7">

                    No current picks were
                    found in the snapshot.

                  </td>

                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>


    <div
      class="card wide"
      style="margin-top:12px"
    >

      <div class="label">
        Team news
      </div>

      ${
        news ||

        `
          <div class="muted">
            No flagged squad news.
          </div>
        `
      }

    </div>

  `;

}


/* =====================================================
   FIXTURES
   ===================================================== */

function fixtures(){

  const players =
    [...D.allPlayers]

      .sort(
        (a,b) =>
          b.total_points -
          a.total_points
      )

      .slice(
        0,
        50
      );


  return `

    <div class="card">

      <div class="label">
        Top 50 players by current points
      </div>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>Player</th>
              <th>Club</th>
              <th>Price</th>
              <th>Pts</th>
              <th>Form</th>
              <th>Next 5</th>

            </tr>

          </thead>


          <tbody>

            ${
              players.map(p => `

                <tr>

                  <td>
                    ${esc(p.name)}
                  </td>

                  <td>
                    ${esc(p.team_short)}
                  </td>

                  <td>
                    ${money(p.price)}
                  </td>

                  <td>
                    <b>
                      ${p.total_points}
                    </b>
                  </td>

                  <td>
                    ${esc(p.form)}
                  </td>

                  <td>
                    ${
                      p.next5
                        .map(fixture)
                        .join(' ')
                    }
                  </td>

                </tr>

              `).join('')
            }

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =====================================================
   PRICES
   ===================================================== */

function prices(){

  const movers =
    [...D.allPlayers]

      .filter(
        p =>
          p.price_change !== 0
      )

      .sort(
        (a,b) =>
          Math.abs(
            b.price_change
          )
          -
          Math.abs(
            a.price_change
          )
      )

      .slice(
        0,
        40
      );


  return `

    <div class="card">

      <div class="label">
        Price engine
      </div>

      <p>
        Current FPL prices are read
        from the official FPL snapshot.
      </p>


      <div class="row">

        <span>
          Price change time
        </span>

        <b>
          00:00 UK
        </b>

      </div>


      <div class="row">

        <span>
          Maximum daily move
        </span>

        <b>
          £0.1m
        </b>

      </div>

    </div>


    <div
      class="card"
      style="margin-top:12px"
    >

      <div class="scroll">

        <table>

          <thead>

            <tr>
              <th>Player</th>
              <th>Price</th>
              <th>GW price change</th>
            </tr>

          </thead>


          <tbody>

            ${
              movers.length

                ?

                movers.map(p => `

                  <tr>

                    <td>
                      ${esc(p.name)}
                    </td>

                    <td>
                      ${money(p.price)}
                    </td>

                    <td
                      class="${
                        p.price_change > 0
                          ? 'good'
                          : 'bad'
                      }"
                    >

                      ${
                        p.price_change > 0
                          ? '+'
                          : ''
                      }

                      ${
                        p.price_change
                          .toFixed(1)
                      }m

                    </td>

                  </tr>

                `).join('')

                :

                `
                  <tr>
                    <td colspan="3">
                      No price moves in
                      the current snapshot.
                    </td>
                  </tr>
                `
            }

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =====================================================
   HISTORY
   ===================================================== */

function history(){

  return `

    <div class="card">

      <div class="label">
        Season memory
      </div>


      <div class="scroll">

        <table>

          <thead>

            <tr>
              <th>GW</th>
              <th>Pts</th>
              <th>Total</th>
              <th>Rank</th>
              <th>Transfers</th>
              <th>Hit</th>
            </tr>

          </thead>


          <tbody>

            ${
              D.history.length

                ?

                D.history.map(h => `

                  <tr>

                    <td>
                      ${h.event}
                    </td>

                    <td>
                      ${h.points}
                    </td>

                    <td>
                      ${h.total_points}
                    </td>

                    <td>
                      ${Number(
                        h.overall_rank ||
                        0
                      ).toLocaleString()}
                    </td>

                    <td>
                      ${h.event_transfers || 0}
                    </td>

                    <td>
                      ${h.event_transfers_cost || 0}
                    </td>

                  </tr>

                `).join('')

                :

                `
                  <tr>
                    <td colspan="6">
                      No history found.
                    </td>
                  </tr>
                `
            }

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =====================================================
   CHIPS
   ===================================================== */

function chips(){

  return `

    <div class="grid">

      ${
        D.chips.map(c => `

          <div class="card">

            <div class="label">

              ${c.label}
              · half ${c.half}

            </div>

            <div class="big">
              AVAILABLE
            </div>

          </div>

        `).join('')
      }

    </div>


    <div
      class="card"
      style="margin-top:12px"
    >

      <b>
        2026/27 chip rules
      </b>


      <p class="muted">

        There are two sets of Wildcard,
        Free Hit, Bench Boost and Triple
        Captain.

        The first set expires after GW19.

        Only one chip can be used in a
        Gameweek.

      </p>

    </div>

  `;

}


/* =====================================================
   RENDER
   ===================================================== */

async function render(
  tab = 'home'
){

  if(!D){
    return;
  }


  if(tab === 'home'){

    $('#app').innerHTML =
      dashboard();

  }

  else if(tab === 'fixtures'){

    $('#app').innerHTML =
      fixtures();

  }

  else if(tab === 'prices'){

    $('#app').innerHTML =
      prices();

  }

  else if(tab === 'history'){

    $('#app').innerHTML =
      history();

  }

  else if(tab === 'chips'){

    $('#app').innerHTML =
      chips();

  }

}


/* =====================================================
   TABS
   ===================================================== */

document
  .querySelectorAll(
    '.tabs .btn'
  )
  .forEach(button => {

    button.onclick =
      async () => {

        document
          .querySelectorAll(
            '.tabs .btn'
          )
          .forEach(x =>
            x.classList.remove(
              'active'
            )
          );


        button.classList.add(
          'active'
        );


        await render(
          button.dataset.tab
        );

      };

  });


/* =====================================================
   SERVICE WORKER
   ===================================================== */

if(
  'serviceWorker'
  in navigator
){

  navigator.serviceWorker
    .register(
      '/sw.js?v=7'
    )
    .catch(
      () => {}
    );

}


/* =====================================================
   START
   ===================================================== */

loadAll();

</script>

</body>
</html>
