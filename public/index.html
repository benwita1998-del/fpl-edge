<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>FPL Edge</title>

<style>
:root{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1020;
  color:#f4f6fb
}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:1250px;margin:auto;padding:18px}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap
}
.logo{font-size:26px;font-weight:900}
.muted{color:#9da7bc}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:18px 0
}
.btn{
  border:1px solid #303a52;
  background:#151d31;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer
}
.btn.active{background:#fff;color:#101522}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}
.card{
  background:#121a2b;
  border:1px solid #27324a;
  border-radius:14px;
  padding:15px
}
.wide{grid-column:1/-1}
.label{
  font-size:12px;
  color:#8e9ab2;
  text-transform:uppercase;
  letter-spacing:.08em
}
.big{font-size:24px;font-weight:800;margin-top:5px}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{
  text-align:left;
  padding:9px;
  border-bottom:1px solid #27324a;
  white-space:nowrap;
  font-size:13px
}
.pill{
  padding:3px 7px;
  border-radius:999px;
  background:#24304a
}
.good{color:#7ee2a8}
.bad{color:#ff8d9d}
.warn{color:#ffd36e}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid #27324a
}
.hero{font-size:21px;font-weight:800}
.footer{
  margin:20px 0;
  color:#75809a;
  font-size:12px
}
.error{
  border:1px solid #6b3440;
  background:#24141a
}
.ok{
  border:1px solid #285d46;
  background:#12251d
}
.loading{
  padding:30px;
  text-align:center
}
@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:12px}
  th,td{font-size:12px;padding:7px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div>
      <div class="logo">⚽ FPL Edge</div>
      <div class="muted" id="sub">Loading your team…</div>
    </div>

    <button class="btn" id="refresh">Refresh live data</button>
  </div>

  <div class="tabs">
    <button class="btn active" data-tab="home">Dashboard</button>
    <button class="btn" data-tab="prices">Prices</button>
    <button class="btn" data-tab="fixtures">Fixtures</button>
    <button class="btn" data-tab="history">History</button>
  </div>

  <div id="app" class="loading">
    Loading official FPL data…
  </div>

  <div class="footer">
    Official FPL public data. Predictions are model estimates, not guaranteed points.
  </div>

</div>

<script>

const TEAM_ID = 702959;

const CACHE_URL =
  'https://raw.githubusercontent.com/benwita1998-del/fpl-edge/refs/heads/fpl-cache/data/live.json';

const $ = s => document.querySelector(s);

const esc = s =>
  String(s ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');

const money = x =>
  `£${Number(x || 0).toFixed(1)}m`;

let D = null;


/* =========================
   LOAD DATA
   ========================= */

async function load(){

  $('#sub').textContent = 'Loading FPL Edge data…';

  const url = CACHE_URL + '?t=' + Date.now();

  const r = await fetch(url, {
    cache: 'no-store'
  });

  if (!r.ok) {
    throw new Error(`FPL cache returned HTTP ${r.status}`);
  }

  const text = await r.text();

  let j;

  try {
    j = JSON.parse(text);
  } catch(e) {
    throw new Error('FPL cache returned invalid JSON');
  }

  if (!j || !j.bootstrap || !j.entry) {
    throw new Error('FPL cache is missing required team data');
  }

  D = normalise(j);

  $('#sub').textContent =
    `${D.entry.name} · GW${D.gw} · ${D.entry.player_first_name} ${D.entry.player_last_name}`;

  render('home');
}


/* =========================
   NORMALISE DATA
   ========================= */

function normalise(j){

  const b = j.bootstrap;

  const e = j.entry;

  const h = j.history || {};

  const t = j.transfers || [];

  const p = j.picks || {picks:[]};

  let gw = j.gameweek;

  if (!gw) {
    const current =
      b.events.find(x => x.is_current);

    const next =
      b.events.find(x => x.is_next);

    const firstUnfinished =
      b.events.find(x => !x.finished);

    gw =
      current?.id ||
      next?.id ||
      firstUnfinished?.id ||
      1;
  }

  return build(b,e,h,t,p,gw);
}


/* =========================
   BUILD TEAM DATA
   ========================= */

function build(b,e,h,t,p,gw){

  const tm =
    Object.fromEntries(
      b.teams.map(x => [x.id,x])
    );

  const pm =
    Object.fromEntries(
      b.elements.map(x => [x.id,x])
    );

  const fs = b.fixtures || [];


  const next5 = x => {

    if (!x) return [];

    return fs
      .filter(f =>
        f.event != null &&
        f.event >= gw &&
        (
          f.team_h === x.team ||
          f.team_a === x.team
        )
      )
      .sort((a,c) => a.event - c.event)
      .slice(0,5)
      .map(f => {

        const home =
          f.team_h === x.team;

        const opponent =
          tm[home ? f.team_a : f.team_h];

        return {
          home,
          opponent: opponent?.short_name || 'TBC',
          fdr: home
            ? f.team_h_difficulty
            : f.team_a_difficulty,
          event: f.event,
          kickoff: f.kickoff_time
        };

      });

  };


  const squad =
    (p.picks || [])
      .map(x => {

        const player =
          pm[x.element];

        if (!player) return null;

        return {
          ...x,
          player,
          next5: next5(player)
        };

      })
      .filter(Boolean);


  const all =
    b.elements.map(x => ({

      ...x,

      name: x.web_name,

      team_short:
        tm[x.team]?.short_name || '',

      team_name:
        tm[x.team]?.name || '',

      price:
        x.now_cost / 10,

      next5:
        next5(x),

      price_change_event:
        (x.cost_change_event || 0) / 10,

      price_change_start:
        (x.cost_change_start || 0) / 10

    }));


  return {
    b,
    entry:e,
    history:h.current || [],
    chips:h.chips || [],
    transfers:t,
    picks:p,
    gw,
    squad,
    all,
    fixtures:fs
  };

}


/* =========================
   STATS
   ========================= */

function stats(){

  const gwHistory =
    D.history.find(x => x.event === D.gw);

  return `
    <div class="grid">

      <div class="card">
        <div class="label">Rank</div>
        <div class="big">
          ${Number(
            D.entry.summary_overall_rank || 0
          ).toLocaleString()}
        </div>
      </div>

      <div class="card">
        <div class="label">Points</div>
        <div class="big">
          ${D.entry.summary_overall_points || 0}
        </div>
      </div>

      <div class="card">
        <div class="label">Team value</div>
        <div class="big">
          ${money(D.entry.last_deadline_value / 10)}
        </div>
      </div>

      <div class="card">
        <div class="label">Bank</div>
        <div class="big">
          ${money(D.entry.last_deadline_bank / 10)}
        </div>
      </div>

      <div class="card">
        <div class="label">Transfers this GW</div>
        <div class="big">
          ${gwHistory?.event_transfers || 0}
        </div>
      </div>

      <div class="card">
        <div class="label">Squad</div>
        <div class="big">
          ${D.squad.length}
        </div>
      </div>

      <div class="card">
        <div class="label">Chips used</div>
        <div class="big">
          ${D.chips.length}
        </div>
      </div>

      <div class="card">
        <div class="label">Gameweek</div>
        <div class="big">
          ${D.gw}
        </div>
      </div>

    </div>
  `;

}


/* =========================
   FIXTURE DISPLAY
   ========================= */

function fx(x){

  return (x.next5 || [])
    .map(f => `
      <span class="pill">
        ${f.home ? 'H' : 'A'}
        ${esc(f.opponent)}
        · FDR ${f.fdr}
      </span>
    `)
    .join(' ');

}


/* =========================
   DASHBOARD
   ========================= */

function home(){

  const rows =
    D.squad
      .map(x => `

        <tr>

          <td>
            <b>${esc(x.player.web_name)}</b>
            ${x.is_captain ? ' · C' : ''}
            ${x.is_vice_captain ? ' · VC' : ''}
          </td>

          <td>
            ${
              D.b.teams.find(
                t => t.id === x.player.team
              )?.short_name || ''
            }
          </td>

          <td>
            ${money(x.player.now_cost / 10)}
          </td>

          <td>
            ${x.player.total_points}
          </td>

          <td>
            ${x.player.form}
          </td>

          <td>
            ${
              x.player.status === 'a'
              ? '<span class="good">Available</span>'
              : '<span class="warn">' +
                esc(
                  x.player.news ||
                  x.player.status
                ) +
                '</span>'
            }
          </td>

          <td>
            ${fx(x)}
          </td>

        </tr>

      `)
      .join('');


  return `
    ${stats()}

    <div
      class="card wide"
      style="margin-top:12px"
    >

      <div class="label">
        Team ${TEAM_ID}
      </div>

      <div class="scroll">

        <table>

          <thead>
            <tr>
              <th>Player</th>
              <th>Club</th>
              <th>Price</th>
              <th>Pts</th>
              <th>Form</th>
              <th>Status</th>
              <th>Next 5</th>
            </tr>
          </thead>

          <tbody>

            ${
              rows ||
              `
                <tr>
                  <td colspan="7">
                    Picks are not currently available.
                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>
  `;

}


/* =========================
   PRICES
   ========================= */

function prices(){

  const players =
    D.all
      .filter(x =>
        x.price_change_event ||
        x.price_change_start
      )
      .sort(
        (a,b) =>
          Math.abs(b.price_change_event) -
          Math.abs(a.price_change_event)
      )
      .slice(0,100);


  return `

    <div class="card">

      <div class="label">
        Official FPL price data
      </div>

      <div class="scroll">

        <table>

          <thead>
            <tr>
              <th>Player</th>
              <th>Price</th>
              <th>GW move</th>
              <th>Season move</th>
              <th>Ownership</th>
            </tr>
          </thead>

          <tbody>

            ${players.map(x => `

              <tr>

                <td>
                  ${esc(x.name)}
                </td>

                <td>
                  ${money(x.price)}
                </td>

                <td
                  class="${
                    x.price_change_event > 0
                    ? 'good'
                    : 'bad'
                  }"
                >
                  ${
                    x.price_change_event > 0
                    ? '+'
                    : ''
                  }${x.price_change_event.toFixed(1)}m
                </td>

                <td>
                  ${
                    x.price_change_start > 0
                    ? '+'
                    : ''
                  }${x.price_change_start.toFixed(1)}m
                </td>

                <td>
                  ${x.selected_by_percent || 0}%
                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =========================
   FIXTURES
   ========================= */

function fixtures(){

  const players =
    [...D.all]
      .sort(
        (a,b) =>
          b.total_points -
          a.total_points
      )
      .slice(0,60);


  return `

    <div class="card">

      <div class="label">
        Next five fixtures
      </div>

      <div class="scroll">

        <table>

          <thead>
            <tr>
              <th>Player</th>
              <th>Club</th>
              <th>Price</th>
              <th>Next 5</th>
            </tr>
          </thead>

          <tbody>

            ${players.map(x => `

              <tr>

                <td>
                  ${esc(x.name)}
                </td>

                <td>
                  ${x.team_short}
                </td>

                <td>
                  ${money(x.price)}
                </td>

                <td>
                  ${fx(x)}
                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =========================
   HISTORY
   ========================= */

function history(){

  return `

    <div class="card">

      <div class="label">
        Season history
      </div>

      <div class="scroll">

        <table>

          <thead>
            <tr>
              <th>GW</th>
              <th>Pts</th>
              <th>Total</th>
              <th>Rank</th>
              <th>Transfers</th>
              <th>Hit</th>
            </tr>
          </thead>

          <tbody>

            ${D.history.map(h => `

              <tr>

                <td>${h.event}</td>

                <td>${h.points}</td>

                <td>${h.total_points}</td>

                <td>
                  ${Number(
                    h.overall_rank || 0
                  ).toLocaleString()}
                </td>

                <td>
                  ${h.event_transfers}
                </td>

                <td>
                  ${h.event_transfers_cost}
                </td>

              </tr>

            `).join('')}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =========================
   TAB NAVIGATION
   ========================= */

function render(tab){

  document
    .querySelectorAll('[data-tab]')
    .forEach(b =>
      b.classList.toggle(
        'active',
        b.dataset.tab === tab
      )
    );


  $('#app').innerHTML =
    tab === 'home'
      ? home()
      : tab === 'prices'
      ? prices()
      : tab === 'fixtures'
      ? fixtures()
      : history();

}


/* =========================
   BUTTONS
   ========================= */

document
  .querySelectorAll('[data-tab]')
  .forEach(b =>
    b.onclick = () =>
      render(b.dataset.tab)
  );


$('#refresh').onclick = () =>
  load().catch(e => {

    $('#app').innerHTML = `
      <div class="card error">

        <b>FPL data unavailable</b>

        <p>
          ${esc(e.message)}
        </p>

      </div>
    `;

  });


/* =========================
   START APP
   ========================= */

load().catch(e => {

  $('#sub').textContent =
    'FPL connection error';

  $('#app').innerHTML = `
    <div class="card error">

      <b>Unable to load FPL data</b>

      <p>
        ${esc(e.message)}
      </p>

      <p class="muted">
        The app is online, but the FPL cache
        could not be loaded.
      </p>

    </div>
  `;

});


/* =========================
   SERVICE WORKER
   ========================= */

if ('serviceWorker' in navigator) {

  navigator.serviceWorker
    .register('/sw.js?v=5')
    .catch(() => {});

}

</script>

</body>
</html>
