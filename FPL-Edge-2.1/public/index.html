<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>FPL Edge</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#f4f6fb}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:25px;font-weight:900}.muted{color:#9da7bc}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.btn{border:1px solid #303a52;background:#151d31;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.active{background:#fff;color:#101522}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#121a2b;border:1px solid #27324a;border-radius:14px;padding:15px}.wide{grid-column:1/-1}.label{font-size:12px;color:#8e9ab2;text-transform:uppercase;letter-spacing:.08em}.big{font-size:24px;font-weight:800;margin-top:5px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #27324a;white-space:nowrap;font-size:13px}.pill{padding:3px 7px;border-radius:999px;background:#24304a}.good{color:#7ee2a8}.bad{color:#ff8d9d}.warn{color:#ffd36e}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #27324a}.hero{font-size:20px;font-weight:800}.move{display:inline-block;margin:3px 5px 3px 0;padding:5px 7px;background:#202a41;border-radius:8px}.status{font-size:12px}.footer{margin:20px 0;color:#75809a;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div><div class="logo">⚽ FPL Edge</div><div class="muted" id="sub">Loading your team…</div></div><button class="btn" onclick="loadAll()">Refresh live data</button></div><div class="tabs"><button class="btn active" data-tab="home">Dashboard</button><button class="btn" data-tab="transfers">Transfers</button><button class="btn" data-tab="fixtures">Fixtures</button><button class="btn" data-tab="chips">Chips</button><button class="btn" data-tab="prices">Prices</button><button class="btn" data-tab="history">History</button></div><div id="app"></div><div class="footer">FPL Edge uses official FPL public data. Recommendations are model projections, not guaranteed points.</div></div><script>
let D=null,OPT=null;const $=s=>document.querySelector(s);const money=x=>`£${Number(x||0).toFixed(1)}m`;const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;');
async function loadAll(){ $('#sub').textContent='Syncing official FPL data…'; try{const r=await fetch('/api/data');D=await r.json();$('#sub').textContent=`${D.teamName} · GW${D.gameweek} · ${D.manager}`;render()}catch(e){$('#app').innerHTML=`<div class="card">Unable to load FPL data: ${esc(e.message)}</div>`}}
function stats(){return `<div class="grid">${[['Overall rank',Number(D.rank).toLocaleString()],['Points',D.points],['Team value',money(D.value)],['Bank',money(D.bank)],['Free transfers',D.freeTransfers],['GW transfers',D.transfersThisGW],['Squad',D.squad.length],['Chips left',D.chips.filter(x=>!x.used).length]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div>`}
function fixture(f){return `<span class="pill">${f.home?'H':'A'} ${f.opponent} · FDR ${f.fdr}</span>`}
function dashboard(){const rows=D.squad.map(x=>`<tr><td><b>${esc(x.player.web_name)}</b><br><span class="muted">${x.position}</span></td><td>${x.player.team_short}</td><td>${money(x.player.now_cost/10)}</td><td>${x.player.total_points}</td><td>${x.player.form}</td><td>${x.player.status==='a'?'<span class="good">Available</span>':'<span class="warn">'+esc(x.player.news||x.player.status)+'</span>'}</td><td>${x.next5.map(fixture).join(' ')}</td></tr>`).join('');return stats()+`<div class="card wide" style="margin-top:12px"><div class="label">Current squad</div><div class="scroll"><table><thead><tr><th>Player</th><th>Club</th><th>Price</th><th>Pts</th><th>Form</th><th>Status</th><th>Next 5</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card wide" style="margin-top:12px"><div class="label">Team news</div>${D.news.length?D.news.map(n=>`<div class="row"><span><b>${esc(n.name)}</b> <span class="muted">${esc(n.status)}</span></span><span class="status">${esc(n.news||('Chance '+(n.chance??'unknown')+'%'))}</span></div>`).join(''):'<div class="muted">No flagged squad news.</div>'}</div>`}
async function transfers(){if(!OPT){const r=await fetch('/api/optimize',{method:'POST'});OPT=await r.json()}return `<div class="card"><div class="label">Decision engine · GW${OPT.gameweek}</div><div class="hero">${esc(OPT.verdict)}</div><p class="muted">${OPT.freeTransfers} free transfer${OPT.freeTransfers===1?'':'s'} · bank ${money(OPT.bank)}</p></div><div class="card" style="margin-top:12px"><div class="scroll"><table><thead><tr><th>Plan</th><th>Free</th><th>Hit</th><th>Cost</th><th>Gross</th><th>Net</th><th>Moves</th></tr></thead><tbody>${OPT.summary.map(x=>`<tr><td><b>${x.transfers} FT</b></td><td>${x.freeTransfers}</td><td>${x.hits}</td><td>${x.cost==null?'—':money(x.cost)}</td><td>${x.grossGain??'—'}</td><td class="${x.netGain>0?'good':'bad'}"><b>${x.netGain??'—'}</b></td><td>${x.moves.map(m=>`<span class="move">${esc(m.out)} → ${esc(m.in)} (+${m.delta})</span>`).join('')}</td></tr>`).join('')}</tbody></table></div></div>`}
function fixtures(){const ps=[...D.allPlayers].sort((a,b)=>b.score-a.score).slice(0,50);return `<div class="card"><div class="label">Next-five model</div><div class="scroll"><table><thead><tr><th>Player</th><th>Club</th><th>Price</th><th>Model</th><th>Next 5</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.team_short}</td><td>${money(p.price)}</td><td><b>${p.score}</b></td><td>${p.next5.map(fixture).join(' ')}</td></tr>`).join('')}</tbody></table></div></div>`}
function chips(){return `<div class="grid">${D.chips.map(c=>`<div class="card"><div class="label">${c.label} · half ${c.half}</div><div class="big">${c.used?`Used GW${c.used.event}`:'AVAILABLE'}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><b>Chip rules</b><p class="muted">2026/27 has two sets of Wildcard, Free Hit, Bench Boost and Triple Captain. The first set expires after GW19; only one chip can be active in a Gameweek. Free Hit cannot be used in consecutive Gameweeks.</p></div>`}
function prices(){const movers=D.allPlayers.filter(p=>p.price_change!==0).sort((a,b)=>Math.abs(b.price_change)-Math.abs(a.price_change)).slice(0,30);return `<div class="card"><div class="label">Price engine</div><p>Official FPL price is the source of truth. The app stores price snapshots and distinguishes observed moves from predictions.</p><div class="row"><span>Price change deadline</span><b>00:00 UK</b></div><div class="row"><span>Predictor refresh</span><b>15 min</b></div><div class="row"><span>Daily price move</span><b>Up to £0.1m</b></div></div><div class="card" style="margin-top:12px"><div class="scroll"><table><thead><tr><th>Player</th><th>Price</th><th>Observed move</th><th>Status</th></tr></thead><tbody>${movers.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td class="${p.price_change>0?'good':'bad'}">${p.price_change>0?'+':''}${p.price_change.toFixed(1)}m</td><td>${esc(p.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function history(){return `<div class="card"><div class="label">Season memory</div><div class="scroll"><table><thead><tr><th>GW</th><th>Pts</th><th>Total</th><th>Rank</th><th>Transfers</th><th>Hit</th></tr></thead><tbody>${D.history.map(h=>`<tr><td>${h.event}</td><td>${h.points}</td><td>${h.total_points}</td><td>${Number(h.overall_rank||0).toLocaleString()}</td><td>${h.event_transfers}</td><td>${h.event_transfers_cost}</td></tr>`).join('')}</tbody></table></div></div>`}
async function render(tab='home'){if(tab==='home')$('#app').innerHTML=dashboard();else if(tab==='transfers')$('#app').innerHTML=await transfers();else if(tab==='fixtures')$('#app').innerHTML=fixtures();else if(tab==='chips')$('#app').innerHTML=chips();else if(tab==='prices')$('#app').innerHTML=prices();else $('#app').innerHTML=history()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');await render(b.dataset.tab)});loadAll();
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script></body></html>
